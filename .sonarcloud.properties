# SonarCloud configuration for Automatic Analysis
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx,node_modules/**,.next/**,out/**,.agents/**,.github/**,src/types/api.generated.ts,**/*.generated.ts
sonar.cpd.exclusions=src/types/api.generated.ts,**/*.generated.ts
